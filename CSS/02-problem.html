<!DOCTYPE html>
<html>
<head>
    <title>Tasty Bites Restaurant</title>
    <style>
        /* Restaurant Header */
        .header {
            background-color: #8B0000; /* HEX color */
            color: white;              /* Color name */
            text-align: center;
            padding: 20px;
        }

        /* Special Dishes */
        .dishes {
            background-color: rgb(245, 245, 220); /* RGB color */
            padding: 20px;
        }

        .dishes h2 {
            text-align: center;
            color: #8B0000; /* HEX color */
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        /* Promotional Section */
        .promotion {
            background-color: rgb(255, 220, 225); /* RGB color */
            color: maroon;                         /* Color name */
            text-align: center;
            padding: 25px;
        }

        /* Footer */
        .footer {
            background-color: #333333; /* HEX color */
            color: white;
            padding: 15px;
            overflow: auto;
        }

        .left {
            text-align: left;
        }

        .right {
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- Restaurant Header -->
    <header class="header">
        <h1>Tasty Bites Restaurant</h1>
        <p>Good Food Makes a Better Mood</p>
    </header>

    <!-- Special Dishes -->
    <section class="dishes">
        <h2>Our Special Dishes</h2>

        <table>
            <tr style="background-color: orange; color: white;">
                <th>Dish Name</th>
                <th>Type</th>
                <th>Price</th>
            </tr>

            <tr style="background-color: white; color: black;">
                <td>Margherita Pizza</td>
                <td>Veg</td>
                <td>₹249</td>
            </tr>

            <tr style="background-color: lightyellow; color: black;">
                <td>Paneer Butter Masala</td>
                <td>Veg</td>
                <td>₹279</td>
            </tr>

            <tr style="background-color: white; color: black;">
                <td>Chicken Biryani</td>
                <td>Non-Veg</td>
                <td>₹299</td>
            </tr>

            <tr style="background-color: lightyellow; color: black;">
                <td>Chocolate Brownie</td>
                <td>Dessert</td>
                <td>₹149</td>
            </tr>
        </table>
    </section>

    <!-- Promotional Message -->
    <section class="promotion">
        <h2>Visit Us &amp; Enjoy Delicious Food!</h2>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p class="left">Open Daily: 11 AM – 11 PM</p>
        <p class="right">Thank You</p>
    </footer>

</body>
</html>
